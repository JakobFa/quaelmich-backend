plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.jakobfa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Login: Spring Security + JWT-Tokens (selbst ausgestellt, HMAC-signiert)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Offizielles Garmin FIT SDK zum Schreiben von .fit-Workout-Dateien
	implementation 'com.garmin:fit:21.218.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Bericht für die wöchentliche Plan-Prüfung: Pläne für erfundene Profile (keine echten Nutzerdaten)
tasks.register('planReport', JavaExec) {
	description = 'Schreibt Beispielpläne für viele erfundene Fahrer nach build/plan-report.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.PlanReport'
	args = [layout.buildDirectory.file('plan-report.md').get().asFile.path]
}

tasks.register('planSimulation', JavaExec) {
	description = 'Simuliert erfundene Fahrer (Profile × Fahrer-Typen) im Wochen-Kreislauf über ihren ganzen Plan: build/plan-simulation.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.SimulationReport'
	// optional: -Pprevious=Pfad/latest.tsv (Bericht der Vornacht) für den Abschnitt "Änderungen"
	doFirst {
		args = [layout.buildDirectory.file('plan-simulation.md').get().asFile.path] +
				(project.findProperty('previous') ? [project.findProperty('previous')] : [])
	}
}

// Zufallssuche: so viele zufällige erfundene Fahrer wie in die Zeit passen; Befunde gruppiert, mit Startwert zum Nachstellen
tasks.register('fuzzSimulation', JavaExec) {
	description = 'Zufällige erfundene Fahrer im Wochen-Kreislauf: [-PbudgetSeconds=60] [-PfuzzBase=Tag] [-Pseed=Startwert] → build/fuzz-simulation.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.FuzzSimulation'
	doFirst {
		args = [layout.buildDirectory.file('fuzz-simulation.md').get().asFile.path,
				project.findProperty('budgetSeconds') ?: '60', project.findProperty('fuzzBase') ?: '',
				project.findProperty('seed') ?: '']
	}
}

// Bewertet einen Satz Stellschrauben (PlanParameters) mit dem Leistungsmodell an festen Zufallsfahrern
tasks.register('evaluatePlan', JavaExec) {
	description = 'Bewertet Stellschrauben: [-Pparams="loadWeeksPerBlock=4,recoveryVolume=0.5"] [-Priders=1000] [-PfirstSeed=1] [-Pfollowers=true]'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.ParameterEvaluation'
	doFirst {
		args = [project.findProperty('params') ?: '', project.findProperty('riders') ?: '',
				project.findProperty('firstSeed') ?: '', layout.buildDirectory.file('plan-evaluation.md').get().asFile.path,
				project.findProperty('followers') ?: 'false']
	}
}

// Sucht bessere Stellschrauben mit dem Leistungsmodell (Vorschlag, keine Änderung an der App)
tasks.register('optimizePlan', JavaExec) {
	description = 'Sucht Stellschrauben: [-PbudgetSeconds=600] [-PtrainRiders=500] [-PholdoutRiders=1000] → build/plan-optimization.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.PlanOptimizer'
	doFirst {
		args = [layout.buildDirectory.file('plan-optimization.md').get().asFile.path,
				project.findProperty('budgetSeconds') ?: '', project.findProperty('trainRiders') ?: '',
				project.findProperty('holdoutRiders') ?: '']
	}
}

// Persönliche Simulation aus einem Daten-Export; nur lokal, Ergebnis nicht einchecken
tasks.register('exportSimulation', JavaExec) {
	description = 'Simuliert einen echten Nutzer aus seinem Export: -PexportFile=... -Pctl=96 -Patl=55 [-Pfrom=2026-11-03]'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.ExportSimulation'
	doFirst {
		args = [project.findProperty('exportFile'), project.findProperty('ctl') ?: '40', project.findProperty('atl') ?: '40',
				project.findProperty('from') ?: java.time.LocalDate.now().toString(),
				layout.buildDirectory.file('export-simulation.md').get().asFile.path]
	}
}

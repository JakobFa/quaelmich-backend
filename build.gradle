plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.jakobfa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Login: Spring Security + JWT-Tokens (selbst ausgestellt, HMAC-signiert)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Offizielles Garmin FIT SDK zum Schreiben von .fit-Workout-Dateien
	implementation 'com.garmin:fit:21.218.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Bericht für die wöchentliche Plan-Prüfung: Pläne für erfundene Profile (keine echten Nutzerdaten)
tasks.register('planReport', JavaExec) {
	description = 'Schreibt Beispielpläne für viele erfundene Fahrer nach build/plan-report.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.PlanReport'
	args = [layout.buildDirectory.file('plan-report.md').get().asFile.path]
}

tasks.register('planSimulation', JavaExec) {
	description = 'Simuliert erfundene Fahrer mit realistischen Abweichungen über ihren ganzen Plan: build/plan-simulation.md'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.PlanSimulation'
	args = [layout.buildDirectory.file('plan-simulation.md').get().asFile.path]
}

// Persönliche Simulation aus einem Daten-Export; nur lokal, Ergebnis nicht einchecken
tasks.register('exportSimulation', JavaExec) {
	description = 'Simuliert einen echten Nutzer aus seinem Export: -PexportFile=... -Pctl=96 -Patl=55 [-Pfrom=2026-11-03]'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'io.github.jakobfa.webtechproject.service.ExportSimulation'
	doFirst {
		args = [project.findProperty('exportFile'), project.findProperty('ctl') ?: '40', project.findProperty('atl') ?: '40',
				project.findProperty('from') ?: java.time.LocalDate.now().toString(),
				layout.buildDirectory.file('export-simulation.md').get().asFile.path]
	}
}

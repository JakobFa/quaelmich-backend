spring.application.name=webtechproject

# Tests laufen gegen eine H2-Datenbank im Arbeitsspeicher (auch auf GitHub ohne Postgres)
# eigene Datenbank pro Test-Kontext (sonst kollidieren IDs, wenn Tests mit Attrappen einen zweiten Kontext starten)
spring.datasource.url=jdbc:h2:mem:quaelmich-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173

# intervals.icu: in Tests wird ein zufälliger Verschlüsselungsschlüssel erzeugt
app.intervals.base-url=https://intervals.icu
app.intervals.encryption-key=
app.intervals.sync-token=test-sync-token

# Strava: Test-App, die Strava-Aufrufe selbst werden in den Tests simuliert
app.strava.base-url=https://www.strava.com
app.strava.client-id=12345
app.strava.client-secret=test-secret

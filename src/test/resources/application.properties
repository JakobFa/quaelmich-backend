spring.application.name=webtechproject

# Tests laufen gegen eine H2-Datenbank im Arbeitsspeicher (auch auf GitHub ohne Postgres)
spring.datasource.url=jdbc:h2:mem:quaelmich;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173

# intervals.icu ist in Tests ausgeschaltet (kein Schlüssel)
app.intervals.base-url=https://intervals.icu
app.intervals.api-key=
app.intervals.athlete-id=0
app.intervals.allowed-quaelmich-athlete-id=

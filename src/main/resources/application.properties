spring.application.name=webtechproject

# Datenbank: Zugangsdaten kommen aus Umgebungsvariablen (Render),
# lokal greifen die Standardwerte hinter dem Doppelpunkt.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quaelmich}
spring.datasource.username=${DATABASE_USERNAME:${USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:}

# Tabellen automatisch aus den @Entity-Klassen anlegen bzw. anpassen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Erlaubte Frontend-Adressen für CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://quaelmich-frontend.onrender.com}

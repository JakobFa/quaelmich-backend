spring.application.name=webtechproject

# Datenbank: Zugangsdaten kommen aus Umgebungsvariablen (Render),
# lokal greifen die Standardwerte hinter dem Doppelpunkt.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quaelmich}
spring.datasource.username=${DATABASE_USERNAME:${USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:}

# Verbindungen robust halten: tote Verbindungen (z. B. nach einem Neustart der Datenbank)
# werden erkannt und ersetzt, statt Anfragen minutenlang hängen zu lassen.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Tabellen automatisch aus den @Entity-Klassen anlegen bzw. anpassen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Erlaubte Frontend-Adressen für CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://quaelmich-frontend.onrender.com}

# intervals.icu-Anbindung (optional). Ohne API-Schlüssel ist sie ausgeschaltet.
# Der Schlüssel gehört NUR in eine Umgebungsvariable (Render), nie ins Repo.
app.intervals.base-url=https://intervals.icu
app.intervals.api-key=${INTERVALS_API_KEY:}
# 0 = das intervals.icu-Konto, dem der API-Schlüssel gehört
app.intervals.athlete-id=${INTERVALS_ATHLETE_ID:0}
# Nur dieses quaelmich-Profil darf in den intervals.icu-Kalender schreiben
app.intervals.allowed-quaelmich-athlete-id=${INTERVALS_QUAELMICH_ATHLETE_ID:}

# Login: geheimer Schlüssel zum Signieren der JWT-Tokens (mind. 32 Zeichen, nur als Umgebungsvariable!)
app.jwt.secret=${JWT_SECRET:}
app.jwt.validity-days=7

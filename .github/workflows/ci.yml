# Baut das Backend und führt alle Tests aus – bei jedem Push und jedem Pull Request.
# Die Tests laufen gegen die H2-Datenbank im Arbeitsspeicher, es braucht also kein Postgres.
name: Backend CI

on:
  push:
    branches: [main, release, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen und testen
        run: ./gradlew build

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test

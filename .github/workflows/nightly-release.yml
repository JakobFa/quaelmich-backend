# Nächtliche Freigabe: Was tagsüber auf "release" gesammelt wurde, geht nachts live – aber nur, wenn die
# Tests für genau diesen Stand grün sind. Render liefert dann "main" aus.
# "develop" ist das Spiellabor (staging.quaelmich.com) und geht nie automatisch live.
# Dringendes per Hand: Tab "Actions" → "Nächtliche Freigabe" → "Run workflow".
name: Nächtliche Freigabe

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 03:00 (Winter) bzw. 04:00 (Sommer) in Berlin
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release nach main übernehmen, wenn die Tests grün sind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main release
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse origin/release)" ]; then
            echo "Nichts Neues – main ist schon auf dem Stand von release."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main origin/release; then
            echo "main enthält Commits, die nicht in release sind – bitte erst release aktualisieren."
            exit 1
          fi
          sha=$(git rev-parse origin/release)
          result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=build-and-test" \
                     --jq '.check_runs[0].conclusion // "none"')
          if [ "$result" != "success" ]; then
            echo "Tests für ${sha:0:7} nicht grün ($result) – heute keine Freigabe."
            exit 1
          fi
          git push origin "${sha}:refs/heads/main"
          echo "Freigegeben: ${sha:0:7}"
          git log --oneline origin/main..origin/release

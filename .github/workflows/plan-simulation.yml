# Simuliert jede Nacht erfundene Fahrer (Profile × Fahrer-Typen wie Pendler, Wochenend-Fahrer, Urlaub, Rennen,
# Krankheit) im Wochen-Kreislauf über ihren ganzen Trainingsplan – jeden Montag rechnet der Plan neu aus dem Gefahrenen,
# wie in der App – und prüft den Belastungsverlauf gegen sportliche Grenzen. Vergleicht mit der Vornacht.
# Der Bericht liegt danach auf dem Branch "plan-reports" in latest.md; die wöchentliche Plan-Prüfung (Routine) liest ihn.
# Läuft hier statt in der Cloud-Sitzung der Routine, weil dort Gradle kein Netzwerk hat.
name: Plan-Simulation

on:
  schedule:
    - cron: '30 4 * * *' # täglich 04:30 UTC, nach dem Release um 02:00
  workflow_dispatch:

permissions:
  contents: write

# nicht gleichzeitig mit der Plan-Optimierung auf plan-reports schreiben
concurrency:
  group: plan-reports
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Code auschecken (main = live)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Zahlen der Vornacht holen (für "Änderungen gegenüber der Vornacht")
        run: |
          git fetch -q origin plan-reports || true
          git show origin/plan-reports:latest.tsv > /tmp/previous.tsv 2>/dev/null || rm -f /tmp/previous.tsv

      - name: Simulation ausführen
        id: simulation
        run: |
          if [ -f /tmp/previous.tsv ]; then ./gradlew planSimulation -Pprevious=/tmp/previous.tsv
          else ./gradlew planSimulation; fi
        continue-on-error: true

      # Zufallssuche: so viele zufällige erfundene Fahrer wie in 25 Minuten passen (jede Nacht andere); Befunde sind
      # Hinweise, kein Fehler im Lauf
      - name: Zufallssuche
        run: ./gradlew fuzzSimulation -PbudgetSeconds=1500
        continue-on-error: true

      - name: Bericht und Planbericht erzeugen
        run: ./gradlew planReport

      - name: Berichte auf den Branch plan-reports schreiben
        run: |
          set -e
          DATE=$(date -u +%F)
          mkdir -p /tmp/reports
          cp build/plan-simulation.md /tmp/reports/latest.md
          cp build/plan-simulation.tsv /tmp/reports/latest.tsv
          if [ -f build/fuzz-simulation.md ]; then
            cp build/fuzz-simulation.md /tmp/reports/fuzz-latest.md
            # Kurzfassung in latest.md, damit die Plan-Prüfung sie mitliest
            { echo; echo "## Zufallssuche (Kurzfassung – ganze Liste in fuzz-latest.md)"; echo;
              sed -n 3p build/fuzz-simulation.md; echo;
              grep '^|' build/fuzz-simulation.md | head -22; } >> /tmp/reports/latest.md
          fi
          cp build/plan-report.md /tmp/reports/plan-latest.md
          echo "Stand: $DATE (Commit $GITHUB_SHA von main)" > /tmp/reports/STAND.txt
          git config user.name "plan-simulation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin plan-reports || true
          if git rev-parse --verify -q origin/plan-reports >/dev/null; then
            git checkout -q -B plan-reports origin/plan-reports
          else
            git checkout -q --orphan plan-reports
            git rm -rfq . || true
          fi
          cp /tmp/reports/* .
          # Verlauf der Zufallssuche: eine Zeile je Nacht (Datum, Fahrer, mit harten Befunden, mit Warnungen, Arten)
          [ -f build/fuzz-simulation.tsv ] && cat build/fuzz-simulation.tsv >> fuzz-history.tsv || true
          git add latest.md latest.tsv plan-latest.md STAND.txt
          git add fuzz-latest.md fuzz-history.tsv 2>/dev/null || true
          git commit -q -m "Plan-Simulation $DATE" || echo "keine Änderung"
          git push origin plan-reports

      - name: Bericht hochladen
        uses: actions/upload-artifact@v4
        with:
          name: plan-simulation
          path: |
            build/plan-simulation.md
            build/plan-simulation.tsv
            build/fuzz-simulation.md
            build/plan-report.md

      - name: Bei harten Verstößen rot werden
        if: steps.simulation.outcome == 'failure'
        run: |
          echo "Die Simulation hat harte Verstöße gefunden – siehe latest.md auf dem Branch plan-reports."
          exit 1
